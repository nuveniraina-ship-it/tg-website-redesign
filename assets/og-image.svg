<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity=".10"/>
    </pattern>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="14" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
    <mask id="ticket">
      <rect x="0" y="0" width="640" height="300" rx="28" fill="#fff"/>
      <circle cx="460" cy="0" r="20" fill="#000"/>
      <circle cx="460" cy="300" r="20" fill="#000"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#175cd3"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- copy -->
  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="80" y="128" font-size="22" letter-spacing="4" fill-opacity=".75" font-family="Menlo, monospace">TICKET GENERATOR</text>
    <text x="80" y="214" font-size="60" font-weight="700" letter-spacing="-1.5">Your all-in-one</text>
    <text x="80" y="286" font-size="60" font-weight="700" letter-spacing="-1.5">event ticketing</text>
    <text x="80" y="358" font-size="60" font-weight="700" letter-spacing="-1.5">platform</text>
    <text x="80" y="438" font-size="26" fill-opacity=".85">Create · Sell · Send · Scan · Report</text>
    <text x="80" y="540" font-size="22" fill-opacity=".75">First 10 tickets free  ·  No credit card required</text>
  </g>

  <!-- the ticket -->
  <g transform="translate(596 170) scale(.86) rotate(-6 320 150)">
    <g mask="url(#ticket)">
      <rect width="460" height="300" fill="#1849a9"/>
      <rect width="460" height="300" fill="url(#stripes)"/>
      <rect x="460" width="180" height="300" fill="#ffffff"/>
      <line x1="460" y1="22" x2="460" y2="278" stroke="#d5d7da" stroke-width="3" stroke-dasharray="10 9"/>
    </g>
    <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
      <text x="36" y="58" font-size="15" letter-spacing="3" fill-opacity=".75" font-family="Menlo, monospace">ADMIT ONE</text>
      <text x="36" y="140" font-size="40" font-weight="700" letter-spacing="-1">Annual Client</text>
      <text x="36" y="186" font-size="40" font-weight="700" letter-spacing="-1">Summit</text>
      <line x1="36" y1="222" x2="424" y2="222" stroke="#ffffff" stroke-opacity=".35" stroke-dasharray="6 6"/>
      <text x="36" y="262" font-size="20" font-weight="600">Sat, 14 Mar  ·  7:00 PM  ·  Hall B</text>
    </g>
    <!-- stylised QR -->
    <g transform="translate(500 70)" fill="#181d27">
      <rect width="100" height="100" fill="none"/>
      <path d="M0 0h28v28H0zM6 6v16h16V6zM10 10h8v8h-8zM72 0h28v28H72zM78 6v16h16V6zM82 10h8v8h-8zM0 72h28v28H0zM6 78v16h16V78zM10 82h8v8h-8z" fill-rule="evenodd"/>
      <path d="M36 0h8v8h-8zM48 8h8v8h-8zM36 20h8v8h-8zM56 24h8v8h-8zM36 36h8v8h-8zM48 40h12v8H48zM68 36h8v8h-8zM84 40h16v8H84zM0 40h8v8H0zM16 44h12v8H16zM36 56h8v12h-8zM52 56h8v8h-8zM72 52h8v8h-8zM88 60h12v8H88zM40 76h12v8H40zM60 72h8v8h-8zM76 76h8v12h-8zM40 92h8v8h-8zM56 88h12v12H56zM92 84h8v16h-8z"/>
    </g>
    <text x="550" y="216" font-size="12" letter-spacing="2.5" text-anchor="middle" fill="#717680" font-family="Menlo, monospace">SCAN AT ENTRY</text>
    <text x="550" y="262" font-size="12" letter-spacing="1.5" text-anchor="middle" fill="#a4a7ae" font-family="Menlo, monospace">No. 000539</text>
  </g>
</svg>
